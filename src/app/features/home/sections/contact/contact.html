<section id="contact">
  <div class="container fade-up" appFadeUp>
    <p class="section-tag">// contato</p>
    <h2 class="section-title">
      Vamos <span>conversar</span>?
    </h2>
    <div class="section-divider mx-auto"></div>
    <p class="contact-tagline">
      Busco uma vaga de estágio ou júnior em desenvolvimento backend. Se você tem uma oportunidade
      ou quer trocar uma ideia, me mande uma mensagem - eu respondo rápido. &#x26A1;
    </p>
    <a [href]="'mailto:' + links.email" class="btn btn-portfolio btn-portfolio-solid mb-5">
      <i class="bi bi-envelope-fill me-2"></i>
      <span class="__cf_email__" data-cfemail="e59c8a90978088848c89a5809d8488958980cb868a88">
        [email&#160;protected]
      </span>
    </a>
    <div class="mt-4">
      <a [href]="links.linkedin" class="social-link" target="_blank" rel="noopener" title="Linkedin">
        <i class="bi bi-linkedin" aria-hidden="true"></i>
      </a>
      <a [href]="links.github" class="social-link" target="_blank" rel="noopener" title="GitHub">
        <i class="bi bi-github" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</section>
